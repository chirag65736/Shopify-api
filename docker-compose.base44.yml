services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5000"
    environment:
      - FLASK_APP=api.py
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec flask run --debug --host=0.0.0.0 --port=5000"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; req=urllib.request.Request('http://localhost:5000/shopify'); \ntry:\n    urllib.request.urlopen(req, timeout=5)\nexcept urllib.error.HTTPError as e:\n    pass\nexcept Exception:\n    sys.exit(1)\nsys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
